# config/zedm_yaml
# Parameters for Stereolabs ZED mini camera.
# SG2 policy input: native 672x376 VGA at 15 Hz.
---
/**:
    ros__parameters:
        general:
            camera_model: 'zedm'
            camera_name: 'zedm' # overwritten by launch file
            grab_resolution: 'VGA' # The native camera grab resolution. 'HD2K', 'HD1080', 'HD720', 'VGA', 'AUTO'
            grab_frame_rate: 15 # ZED SDK internal grabbing rate
            pub_frame_rate: 15.0 # Published image rate

        depth:
            min_depth: 0.1 # Min: 0.1, Max: 3.0
            max_depth: 10.0 # Max: 20.0
